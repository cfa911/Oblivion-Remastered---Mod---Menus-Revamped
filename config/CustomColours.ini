; Menus Revamped - Custom colours.
; [Colours]: red, green, blue (0-255) per element; detailsPage is one number. [Tab]: tab strip greys (0-255).
; [Skin]: linear red, green, blue, alpha (0-1); the three scrollbar entries are single numbers.
; Missing entries use Dark defaults. Rebuild for baked colours, including [Skin] pattern.
; Other active [Skin] edits need a restart. The Effects heading tint is used only when replacement art is unavailable.
; [Colours] rowSeparator and pickerIcon are retained keys with no effect in this build.

[Colours]
panel = 41, 41, 41                  ; Inventory and Magic list backgrounds
frame = 16, 16, 16                  ; Inventory and Magic list edges and shared scrollbar frame
rowText = 239, 239, 239             ; Inventory and Magic list and details text
rowSeparator = 255, 255, 255        ; Inventory list row divider (inactive)
columnLine = 99, 99, 99             ; Inventory and Magic list column dividers
rowIcon = 239, 239, 239             ; Magic school, spell type and detail icons
headerIcon = 247, 247, 247          ; Inventory and Magic header stat icons
pickerIcon = 245, 245, 245          ; Inventory and Magic sort picker icons (inactive)
listHighlight = 91, 91, 91          ; Inventory and Magic highlighted row background
subTabDisc = 96, 96, 96             ; Inventory selected details tab background
subTabCircle = 72, 72, 72           ; Inventory details tab circle
subTabIcon = 228, 228, 228          ; Inventory details tab icons
pattern = 150, 150, 150             ; Inventory action button laurels - base colour
enchantedDot = 66, 99, 153          ; Inventory enchanted item dot
previewFrameLight = 150, 150, 150   ; Inventory item preview frame highlights
previewFrameDark = 30, 30, 30       ; Inventory item preview frame shadows
parchmentDark = 8, 8, 8             ; Alchemy and other parchment menus - shadows
parchmentLight = 33, 33, 33         ; Alchemy and other parchment menus - highlights
effectBox = 66, 99, 153             ; Alchemy effect boxes
nameBox = 239, 239, 239             ; Alchemy and other editable name fields
filterRow = 66, 66, 66              ; Alchemy filter row background
filterHover = 112, 112, 112         ; Alchemy hovered filter row background
filterSelected = 14, 22, 42         ; Alchemy selected filter row background
filterMark = 92, 140, 214           ; Alchemy filter row diamond
alchemyMetal = 56, 83, 118          ; Alchemy frame, ingredient slots and pot - metal
alchemyStone = 22, 25, 31           ; Alchemy frame, ingredient slots and pot - stone
detailsPage = 0.01                  ; Inventory, Magic and shared details page brightness

[Tab]
selected = 41                       ; Inventory and Magic selected category tab fill
unselected = 33                     ; Inventory and Magic unselected category tab fill
gap = 24                            ; Inventory and Magic gaps between category tabs
outline = 134                       ; Inventory and Magic category tab outlines
glyph = 242                         ; Inventory and Magic selected category tab icons
glyphDim = 162                      ; Inventory and Magic unselected category tab icons

[Skin]
rule = 0.65, 0.65, 0.65, 0.55       ; Inventory and Magic header horizontal lines
guide = 0.55, 0.55, 0.55, 0.13      ; Inventory and Magic header column guides
ring = 0.55, 0.55, 0.55, 1          ; Inventory and Magic details skill level ring
ornament = 0.45, 0.45, 0.45, 1      ; Inventory and Magic details decorative dividers
pattern = 1, 1, 1, 1                ; Inventory action button laurels - tint and opacity
band = 0.41, 0.65, 1, 1             ; Inventory and Magic details Effects heading strip (fallback)
buttonFill = 0.12, 0.12, 0.12, 1    ; Inventory and Magic details action button fill
scrollTrack = 0.0052                ; Skinned menu lists and details scrollbar track
scrollBorder = 0.0052               ; Skinned menu lists and details scrollbar thumb border
scrollInside = 0.0222               ; Skinned menu lists and details scrollbar thumb fill
emphasisInk = 0.125, 0.12, 0.125, 1 ; Inventory and Magic details emphasized perk text
buttonRule = 0.83, 0.83, 0.83, 1    ; Inventory and Magic action button divider centres
