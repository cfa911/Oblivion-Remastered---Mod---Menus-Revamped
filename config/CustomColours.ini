; Menus Revamped - Custom colours.
; [Colours]: red, green, blue (0-255) per element; detailsPage is one number. [Tab]: tab strip greys (0-255).
; [Skin]: tints drawn while the game runs: red, green, blue, alpha (0-1); the scrollbar entries are one number.
; A missing entry uses the default Dark colour. Rebuild the Custom pack after a [Colours] or [Tab] change;
; [Skin] changes need only a game restart.

[Colours]
panel = 41, 41, 41                  ; list page
frame = 16, 16, 16                  ; list page edge and scrollbar
rowText = 239, 239, 239             ; row and details text
rowSeparator = 255, 255, 255        ; row separator line
columnLine = 99, 99, 99             ; row column lines
rowIcon = 239, 239, 239             ; row icons
headerIcon = 247, 247, 247          ; header sort icons
pickerIcon = 245, 245, 245          ; sort picker icons
listHighlight = 91, 91, 91          ; hovered row band
subTabDisc = 96, 96, 96             ; selected details sub-tab disc
subTabCircle = 72, 72, 72           ; details sub-tab circle
subTabIcon = 228, 228, 228          ; details sub-tab icons
pattern = 150, 150, 150             ; laurels beside the action button
enchantedDot = 66, 99, 153          ; enchanted item dot
previewFrameLight = 150, 150, 150   ; item preview frame, light end
previewFrameDark = 30, 30, 30       ; item preview frame, dark end
parchmentDark = 8, 8, 8             ; parchment pages, dark end
parchmentLight = 33, 33, 33         ; parchment pages, light end
effectBox = 66, 99, 153             ; Alchemy effect boxes
nameBox = 239, 239, 239             ; editable name fields
filterRow = 66, 66, 66              ; Alchemy filter rows
filterHover = 112, 112, 112         ; Alchemy filter row under the cursor
filterSelected = 14, 22, 42         ; Alchemy selected filter row
filterMark = 92, 140, 214           ; Alchemy filter diamond
detailsPage = 0.01                  ; details page darkness (0 black .. 1 stock)

[Tab]
selected = 41
unselected = 33
gap = 24
outline = 134
glyph = 242
glyphDim = 162

[Skin]
rule = 0.65, 0.65, 0.65, 0.55       ; header rules
guide = 0.55, 0.55, 0.55, 0.13      ; header guides
ring = 0.55, 0.55, 0.55, 1          ; skill level ring
ornament = 0.45, 0.45, 0.45, 1      ; stats ornament line
pattern = 1, 1, 1, 1                ; laurels (1 = as baked)
band = 0.41, 0.65, 1, 1             ; details effect title band
buttonFill = 0.12, 0.12, 0.12, 1    ; action button fill and arrows
scrollTrack = 0.0052                ; scrollbar track
scrollBorder = 0.0052               ; scrollbar border
scrollInside = 0.0222               ; scrollbar inside
emphasisInk = 0.125, 0.12, 0.125, 1 ; emphasis rows (perk text)
buttonRule = 0.83, 0.83, 0.83, 1    ; action button rule
