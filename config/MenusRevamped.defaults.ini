; Menus Revamped - unified search, category pickers and controller keyboard.
; Layout values use the existing 1920x1080 menu coordinate system.
; Install as MenusRevamped.ini beside MenusRevamped.dll in OBSE/Plugins.
; Read at game startup: restart the game after editing.
; Switches: 1 = enabled, 0 = disabled. Values below are the defaults.
; Layout: increasing X moves right, increasing Y moves down; decimals allowed.

[Log]
; 0 = trace, 1 = debug, 2 = info, 3 = warnings, 4 = errors only.
; Keep 3 for normal play; lower levels are for temporary diagnostics.
uLogLevel=3
[Style]
; UI color preset: 0 = Classic (existing appearance), 1 = Light, 2 = Custom (default colours: Dark).
; Non-Classic presets use built-in bar backgrounds instead of the optional SearchBar PNGs.
; Custom also copies the MRCustom_P texture pack into Content/Paks/~mods at start-up (other presets delete it there) and
; reads its colours from MenusRevamped/CustomColours.ini (written with the defaults when missing).
; Change the preset, then restart the game. Before uninstalling, set 0 and start once (see README).
uPreset=0
[Layout]
; Compact rows: smaller list rows and icons, slightly smaller text and taller lists in Magic, Inventory (icons),
; Alchemy, Enchanting, Spellmaking, Spell Purchase, Stats skills and Quest. 0 = the game's own layout.
; Only values still at the game's default are changed, so another layout mod's sizes are left alone.
bCompactRows=1
[Search]
; Enable search in each menu; container includes barter and both sides.
; Alchemy matches ingredient names and effects already known to the character.
bAlchemy=1
bWorldMap=1
bInventory=1
bMagic=1
bQuests=1
bContainer=1
; Allow input methods such as Japanese/Chinese IME while typing in a bar.
bIme=1
; Unaccented text matches accented letters; typed accents remain specific.
; Searches always ignore letter case.
bIgnoreAccents=1
; Clear all stored searches when returning from menus to gameplay.
; Switching between Inventory, Magic and Quests keeps the text until you exit.
bClearTextOnGameplay=1
; Key that starts typing in a search bar (a click on the bar always works).
; Windows key code in decimal: 70 = F, 191 = / on US keyboards, 0 = click only.
uHotkey=70
; 1 = Ctrl + that key, 0 = the key alone (it then no longer reaches the game in menus with a bar).
bHotkeyCtrl=1
[Bar]
; Search text size for all bars; range 8-60.
uFontSize=19
; Legacy placement fallback. Prefer the menu-specific sections below.
; X/Y = top-left corner, width/height = size, all in menu units.
; Only affects placements whose menu-specific keys are absent.
uX=289
uY=111
uWidth=486
uHeight=36
; Extra Y offsets for the Inventory/Magic fallback; negative moves up.
uYInventory=-1.5
uYMagic=-0.75
[Inventory]
; Inventory bar: top-left X/Y and width/height in menu units.
; Explicit keys here override the corresponding Bar-derived fallback.
; Dark Inventory: the bar sits in the title row, right of the whole tab title ("Miscellaneous" is the longest).
uX=440
uY=262
uWidth=476
uHeight=36
[Magic]
; Magic bar: top-left X/Y and width/height in menu units.
; Explicit keys here override the corresponding Bar-derived fallback.
; The bar sits in the title row, right of the page title (like the Inventory bar).
uX=440
uY=258
uWidth=460
uHeight=36
[Quest]
; Quest bar: top-left X/Y and width/height in menu units.
; Missing keys use the [Bar] place above the tabs (the Magic bar's place before the Magic revamp).
uX=294
uY=110.25
uWidth=481
uHeight=36
[ContainerYours]
; Your side of container/barter menus. Offsets adjust the position above
; that side's header; negative X moves left, negative Y moves up.
; Width/height are menu units; width 0 = header width + 2 * abs(X offset).
uXOffset=-48
uYOffset=-90
uWidth=825
uHeight=37
[ContainerTheirs]
; Other side with its tab row visible; same offset/size rules as Yours.
uXOffset=-48
uYOffset=-90
uWidth=823
uHeight=37
[ContainerTake]
; Other side with its tab row hidden (plain take-only layout).
; Same offset/size rules; width 0 automatically sizes from the header.
uXOffset=-48
uYOffset=-11
uWidth=0
uHeight=37
[Filter]
; Apply text search to lists. 0 disables text filtering, not category pickers.
bEnabled=1
[SearchKeyboard]
; Enable the controller-operated on-screen search keyboard.
bEnabled=1
; Clear this bar's previous text whenever its controller keyboard opens.
bClearTextOnActivation=1
; XInput button mask in decimal: 8 = D-pad right (hold to open).
; In two-sided container/barter menus this targets your side.
; Short taps retain the game's action; 0 disables this binding.
uButton=8
; 4 = D-pad left: target the other side in container/barter menus.
; With only one side available, either binding targets it; 0 disables this binding.
uButtonLeft=4
; Hold duration in milliseconds; range 150-2000.
uHoldMs=400
; Keyboard bounds as percentages of screen width/height, from the top-left.
; Left/top: 0-90; right/bottom: at least 10 beyond left/top, up to 100.
uLeftPercent=49
uTopPercent=14
uRightPercent=93
uBottomPercent=87
; Key-label text scale: 100 = normal size; range 30-300 percent.
uTextPercent=100
; Holding a direction: first repeat after uRepeatDelayMs (100-1000), then every uRepeatRateMs (30-500).
uRepeatDelayMs=350
uRepeatRateMs=110
; Holding X this long (milliseconds, 200-3000) clears the whole text; 0 = holding never clears.
uClearHoldMs=700
[Controller]
; Return controller focus to the item list after choosing a category filter.
bReturnToListAfterFilter=1
; How far the left stick must be pushed (of 32767) before the mod's own lists react: category pickers,
; the on-screen keyboard and world-map results. Range 4000-30000; raise it if a worn stick drifts.
; The game's own menus, movement and camera are not affected.
uStickDeadzone=16000
[Picker]
; Category pickers per menu; 0 leaves that menu's native category controls alone. Search is unaffected.
bInventory=1
bMagic=1
; Container includes barter.
bContainer=1
; Toggle icons beside the pickers: stolen-only and enchanted-only.
bStolenFilter=1
bEnchantedFilter=1
; Category sort: a left click on a category filter (controller: Up/Down on it) groups the list in the filter's order;
; again reverses it; right click (controller: A) opens the filter. 1 = every tab starts grouped, 0 = starts A-Z.
bCategorySort=1
; Order inside a category group: 0 = A-Z, same names by value highest first, then weight;
; 1 = value highest first, equal values A-Z, then weight. The reversed sort is the exact reverse either way.
bCategorySortValueFirst=0

; Alchemy menu: ingredient sort icons with Weight and Value columns (click an icon to sort, again to reverse;
; controller: RB sort icons, LB Selected Filters; X Create, Y Filters, hold Y Clear all stay native), counts on the effect
; filters, and the active-filter line under the Ingredients title (click a name to remove that filter).
[Alchemy]
bEnabled=1
; Sort used the first time the menu opens (later openings keep your last sort): 0 Name, 1 Count, 2 Weight, 3 Value.
uDefaultSort=0
; Effect colour circles: size in pixels (8-20) and 12 colours in selection order. An 8-colour legacy list keeps the last four defaults.
; Example colour-blind friendly set: #0072B2,#E69F00,#56B4E9,#F0E442,#009E73,#D55E00,#CC79A7,#FFFFFF
uMarkerDiameter=18
sMarkerColors=#316EE0,#DC3730,#48AE37,#EFCF2F,#9740C3,#ED8623,#27C0CC,#E05AA0,#607D24,#91512C,#545F91,#F2A8A1

; Integrated Smooth Menus settings; no separate plugin/config is read at runtime.
[Hover]
; Reduce repeated native hover work in each menu; container includes barter.
bInventory=1
bMagic=1
bContainer=1
; Minimum interval between forwarded hover events, in milliseconds (0-1000).
; 0 forwards every event; larger values reduce work but delay hover updates.
uIntervalMs=200
; Settle delay in milliseconds (0-1000): a hovered row updates the details panel once the
; pointer has rested on it this long; sweeping over rows skips the rows passed. 0 uses uIntervalMs.
uSettleMs=100
[Guard]
; Request engine garbage collection when the live object count exceeds uLimit.
bEnabled=1
; Object-count threshold; range 200000-2100000. Keep the default normally.
uLimit=1500000
; Minimum seconds between collection requests; range 1-600.
uCooldown=10
[Metrics]
; Diagnostic performance summaries every 5 seconds at info log level.
; Requires Log uLogLevel=2 or lower; leave disabled for normal play.
bEnabled=0

; World-map search and its result list. Positions are menu canvas units.
[Map]
uX=200
uY=78
uWidth=440
uHeight=36
